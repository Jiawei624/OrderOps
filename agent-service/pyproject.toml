[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "orderops-agent"
version = "0.1.0"
description = "OrderOps Agent service and worker package"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
orderops-agent = "orderops_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = ">=0.12.23"
